name: A股行情日报

on:
  schedule:
    # 北京时间每天 12:10 (UTC+8 = 04:10 UTC), 仅工作日
    - cron: "10 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 拉取数据并生成报告
        env:
          NEODATA_TOKEN: ${{ secrets.NEODATA_TOKEN }}
        run: |
          mkdir -p reports
          python -c "
          import sys; sys.path.insert(0, '.')
          import json
          from scripts.fetch_data import fetch_all_market_data
          from scripts.generate_report import generate_report, generate_email_summary

          data = fetch_all_market_data()
          target = data['target_date']

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          generate_report(data, f'reports/daily_{target}.html')
          summary = generate_email_summary(data)

          with open('email_summary.txt', 'w', encoding='utf-8') as f:
              f.write(summary)

          print(f'SUCCESS: report_date={target}')
          "

      - name: 发送邮件
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_EMAIL_AUTH: ${{ secrets.QQ_EMAIL_AUTH }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          import json, os
          from scripts.send_email import send_report_email

          with open('data.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          target = data['target_date']
          with open(f'reports/daily_{target}.html', 'r', encoding='utf-8') as f:
              html = f.read()
          with open('email_summary.txt', 'r', encoding='utf-8') as f:
              summary = f.read()

          base = os.environ.get('PAGES_BASE', '')
          pages_url = f'{base}/reports/daily_{target}.html' if base else ''

          send_report_email(html, summary, target, pages_url)
          "

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          destination_dir: reports
          keep_files: true
