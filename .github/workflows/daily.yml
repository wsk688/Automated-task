name: A股行情日报

on:
  schedule:
    # 北京时间每天 12:10 (UTC+8 = 04:10 UTC), 仅工作日
    - cron: "10 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 拉取数据并生成报告
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          mkdir -p reports
          python -c "
          import sys; sys.path.insert(0, '.')
          import json, os
          from scripts.fetch_data import fetch_all_market_data
          from scripts.generate_report import generate_report, generate_email_summary

          token = os.environ.get('TUSHARE_TOKEN')
          print(f'[INFO] Tushare token 配置状态: {\"已配置\" if token else \"未配置(将尝试降级东财)\"}')

          data = fetch_all_market_data()
          target = data['target_date']

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          generate_report(data, f'reports/daily_{target}.html')
          summary = generate_email_summary(data)

          with open('email_summary.txt', 'w', encoding='utf-8') as f:
              f.write(summary)

          print(f'SUCCESS: report_date={target} data_source={data[\"data\"][\"data_source\"]}')
          "

      - name: 发送邮件(每日推送至手机)
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_EMAIL_AUTH: ${{ secrets.QQ_EMAIL_AUTH }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          # 未配置邮箱 Secret 时优雅跳过，保证 Pages 始终能部署（手机随时可看）
          if [ -z "$QQ_EMAIL" ] || [ -z "$QQ_EMAIL_AUTH" ] || [ -z "$TO_EMAIL" ]; then
            echo "⚠️ 未配置 QQ 邮箱 Secrets，跳过邮件推送（Pages 仍会部署，手机可访问在线报告）"
            exit 0
          fi
          python -c "
          import sys; sys.path.insert(0, '.')
          import json, os
          from scripts.send_email import send_report_email

          with open('data.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          target = data['target_date']
          with open(f'reports/daily_{target}.html', 'r', encoding='utf-8') as f:
              html = f.read()
          with open('email_summary.txt', 'r', encoding='utf-8') as f:
              summary = f.read()

          # 从 GITHUB_REPOSITORY 解析 Pages 基础 URL，避免 schedule 触发时 repository.name 为空
          repo_full = os.environ.get('GITHUB_REPOSITORY', '')
          pages_url = ''
          if repo_full and '/' in repo_full:
              owner, repo = repo_full.split('/', 1)
              pages_url = f'https://{owner}.github.io/{repo}/reports/daily_{target}.html'

          send_report_email(html, summary, target, pages_url)
          "

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          destination_dir: reports
          keep_files: true
